name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Use an OIDC-capable npm CLI
        run: npm install --global "npm@^11.5.1"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium for the Pixi pixel smoke
        run: npx playwright install --with-deps chromium

      - name: Check source and package build
        run: npm run check

      - name: Audit packed contents
        run: npm run pack:check

      - name: Test clean packed consumers
        run: npm run test:consumers
