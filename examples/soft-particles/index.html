<!doctype html>
<html lang="en">
  <meta charset="UTF-8" /><title>Soft particles · exported consumer</title>
  <style>
    body {
      margin: 0;
      background: #191c24;
      color: #e6e9f0;
      font: 14px system-ui;
    }
    header {
      padding: 16px 22px;
      display: flex;
      gap: 14px;
      align-items: center;
      flex-wrap: wrap;
    }
    label {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    select,
    input,
    button {
      background: #303746;
      color: inherit;
      border: 1px solid #637085;
      border-radius: 4px;
      padding: 5px;
    }
    input[type="number"] {
      width: 62px;
    }
    #view {
      height: calc(100vh - 160px);
      min-height: 300px;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    p,
    pre {
      margin: 8px 22px;
    }
    #error {
      color: #ff9c8d;
      white-space: pre-wrap;
    }
    a {
      color: #8bd9ff;
    }
  </style>
  <header>
    <strong>Soft particles · exported Three consumer</strong>
    <label
      >Backend
      <select id="backend">
        <option value="webgl">WebGL</option>
        <option value="webgpu">WebGPU</option>
        <option value="fallback">WebGL2 fallback</option>
      </select></label
    >
    <label
      >Effect
      <select id="effect"></select
    ></label>
    <label><input type="checkbox" id="enabled" /> Soft Particles</label>
    <label
      >Near <input type="number" id="near" value="0" min="0" step="0.05"
    /></label>
    <label
      >Far <input type="number" id="far" value="1" min="0.01" step="0.05"
    /></label>
    <label><input type="checkbox" id="ortho" checked /> Orthographic</label>
    <label><input type="checkbox" id="bloom" /> Bloom</label>
    <button id="pause">Pause</button
    ><button id="reset">Reset seed / camera</button>
  </header>
  <div id="view"></div>
  <p id="status">Loading export…</p>
  <p>
    Orbit: drag · Zoom: wheel. Compare floor/cube seams at Near 0, Far 0.25 / 1.
    Empty sky and smoke detail away from the objects should remain unchanged.
    Distances are surface-depth gaps in world units.
    <a href="README.md">Review instructions</a>
  </p>
  <pre id="error"></pre>
  <p id="support"></p>
  <p id="runtime"></p>
  <script type="module" src="/main.ts"></script>
</html>
