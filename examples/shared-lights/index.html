<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NixieFX shared lights review</title>
    <style>
      body {
        margin: 0;
        background: #10151c;
        color: #e7edf5;
        font: 14px system-ui;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #view {
        height: 72vh;
      }
      header,
      section {
        padding: 12px 20px;
      }
      h1 {
        font-size: 19px;
        margin: 0 0 10px;
      }
      button,
      select,
      input {
        font: inherit;
        margin: 4px;
        padding: 6px;
        background: #263341;
        color: white;
        border: 1px solid #69798b;
        border-radius: 4px;
      }
      #stats {
        white-space: pre-wrap;
        font:
          12px ui-monospace,
          monospace;
      }
      label {
        display: inline-block;
      }
      p {
        margin: 6px 0;
        color: #bcc9d8;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Shared particle lights · exported consumer</h1>
      <label
        >VFX budget
        <select id="budget">
          <option>0</option>
          <option selected>2</option>
          <option>4</option>
        </select></label
      >
      <button id="pause">Pause</button><button id="restart">Restart</button
      ><button id="remove">Remove instance</button
      ><button id="add">Add instance</button>
      <label
        >Seek
        <input id="seek" type="range" min="0" max="6" step="0.05" value="0"
      /></label>
      <label><input id="overlap" type="checkbox" />Heavy light overlap</label>
      <label
        >Game light
        <input id="game" type="range" min="0" max="5" step="0.1" value="0.2"
      /></label>
      <button id="measure">Measure 30 seconds</button
      ><button id="copy">Copy measurements</button>
      <p>
        Bloom off · shared cap includes fading lights · existing game light
        reserved separately. Drag to orbit.
      </p>
    </header>
    <div id="view"></div>
    <section>
      <div id="stats">Loading normal export…</div>
      <pre id="measurements"></pre>
    </section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
